- id: spotifast-585-closer-look-concrete
  title: Fix song selection with arrow keys and add playlist Delete shortcut
  body: |-
    ## Why

    Song-row arrow navigation moves focus but leaves the clicked song selected, making the highlights ambiguous. Keyboard users also cannot extend a selection with Shift+Up/Down or remove selected playlist songs with Delete.

    ## What changed

    - Up/Down selects only the destination song.
    - Shift+Up/Down extends or shrinks the selection from its anchor.
    - Delete uses the existing "Remove from this playlist" action in editable playlists, respecting text-field focus, dialogs and open menus. On macOS, both the normal Delete key and forward Delete work.
    - Clear selection when playlist contents are refreshed, so stale row indices cannot delete different songs.
    - Add regression coverage in the existing table tests, including Delete with an open row menu.
    - Document the shortcuts in README, the guide, and the translated in-app Keyboard shortcuts dialog.
    - Preserve the active Wayland Keep Above translations during catalog regeneration.

    ## Verification

    Windows, with the pinned Rust toolchain:
    - Passed `cargo fmt --all --check` and `git diff --check`.
    - Passed `cargo test --locked --no-default-features --features demo --lib`: 910 passed, one ignored native credential-store test.
    - Passed the localization integration test and the canonical gettext catalog check.
    - Built and captured the native demo with `--no-default-features --features demo`.
    - Passed `cargo clippy --locked --no-default-features --features demo --all-targets -- -D warnings`.

    The default/all-feature MilkDrop checks remain blocked locally by missing Windows vcpkg configuration. Launcher packaging checks require missing Unix tools/Ruby, and Jekyll requires missing Bundler. No Linux or macOS tests were run locally. Fresh CI on the updated head is still required.

    ## Screenshots

    Native Windows demo captures, baseline `7e2d6c5`, candidate `40fdaf4`. Each pair uses the same playlist, input sequence, theme and window size. Screenshot files are stored on a separate evidence branch, outside this PR.

