- id: ruby_llm-1003-closer-look-risk
  title: Restore attachments from serialized messages
  body: "## What this does\r\n\r\n`Message#to_h` serialized attachments as `{ type:,
    source: }`, and\r\n`Message.new` passed that Hash to `Attachment.new` as a raw
    source. A\r\ntranscript restored with `Chat#messages=` from `Message#to_h` therefore
    had\r\nattachments with no filename or resolution, an `application/octet-stream`\r\nMIME
    type, and no content, and the next request raised\r\n`UnsupportedAttachmentError`.
    Attachments were the one value object that\r\n08035557 did not rebuild.\r\n\r\nFollowing
    the shape agreed in #1001:\r\n\r\n- `Attachment#to_h` adds `filename:` and `resolution:`,
    omitting `nil`s.\r\n  `type` stays in the output and is ignored on input.\r\n-
    A Hash inside an attachment list is rebuilt through `Attachment.from_h`,\r\n  with
    Symbol or String keys and the message's `config:`. A JSON\r\n  `resolution` of
    `\"high\"` is turned back into `:high` before\r\n  `Attachment.new` checks it
    against `RESOLUTIONS`.\r\n- The MIME type is recomputed from the source and filename,
    so there is one\r\n  source of truth.\r\n- Only Hashes inside a list are decoded.
    A top-level Hash is still grouped\r\n  input (`with: { image: path }`), so `attachments:
    attachment.to_h` on its\r\n  own stays grouped, as agreed.\r\n\r\nPaths and URLs
    round-trip through JSON. IO, Active Storage, and\r\n`UploadedFile` sources pass
    through as Ruby objects; no bytes are serialized.\r\n\r\nSeven new examples fail
    before the fix, including the Symbol-key and JSON\r\nround trips at both the `Attachment`
    and `Message` level and\r\n`Chat#messages=` with serialized messages. The String-key
    spec asserts that\r\nthe JSON input carries `\"resolution\" => \"high\"`. Two
    more guard the omitted\r\n`nil` resolution and the forwarded configuration.\r\n\r\nFixes
    #1001\r\n\r\n## Type of change\r\n\r\n- [x] Bug fix\r\n- [ ] New feature\r\n-
    [ ] Breaking change\r\n- [ ] Documentation\r\n- [ ] Performance improvement\r\n\r\n##
    Scope check\r\n\r\n- [x] I read the [Contributing Guide](https://github.com/crmne/ruby_llm/blob/main/CONTRIBUTING.md)\r\n-
    [x] This aligns with RubyLLM's focus on **LLM communication**\r\n- [x] This isn't
    application-specific logic that belongs in user code\r\n- [x] This benefits most
    users, not just my specific use case\r\n\r\n## Quality check\r\n\r\n- [x] I ran
    `overcommit --install` and all hooks pass\r\n- [x] I tested my changes thoroughly\r\n
    \ - [ ] For provider changes: Re-recorded VCR cassettes with `bundle exec rake
    vcr:record[provider_name]`\r\n  - [x] All tests pass: `bundle exec rspec --tag
    ~live` (3,687 examples, 0 failures)\r\n- [x] I updated documentation if needed
    (not needed: `Attachment#to_h` and `.from_h` are `:nodoc:`)\r\n- [x] I didn't
    modify auto-generated files manually (`models.json`, `aliases.json`)\r\n\r\n##
    AI-generated code\r\n\r\n- [x] I used AI tools to help write this code\r\n- [x]
    I have reviewed and understand all generated code (required if above is checked)\r\n\r\n##
    API changes\r\n\r\n- [ ] Breaking change\r\n- [ ] New public methods/classes\r\n-
    [ ] Changed method signatures\r\n- [x] No API changes\r\n"
  pull_request:
    association: CONTRIBUTOR
    files:
    - path: lib/ruby_llm/attachment.rb
      additions: 7
      deletions: 1
      changeType: MODIFIED
    - path: spec/ruby_llm/attachment_spec.rb
      additions: 47
      deletions: 0
      changeType: MODIFIED
    - path: spec/ruby_llm/chat_functions_spec.rb
      additions: 14
      deletions: 0
      changeType: MODIFIED
    - path: spec/ruby_llm/message_spec.rb
      additions: 27
      deletions: 0
      changeType: MODIFIED
    copilot_review: "<!-- ccr-overview-v2 -->\n\n## Copilot review overview\n\n###
      \U0001F535 Needs a closer look\n\nAttachment deserialization affects message
      and chat transcript reconstruction and warrants final human review.\n\n**Review
      effort:** Lite  \n**Findings:** None\n\n<details>\n<summary><strong>What changed
      in this PR</strong></summary>\n\nRestores serialized attachments as usable value
