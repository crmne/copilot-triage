- id: new-long-report-summary
  title: Sustained CPU after connecting
  body: |
    I am running version 0.14.0 on Arch Linux. I first thought this was just
    startup work, because one launch settled down after thirty seconds. But I
    restarted twice more and the CPU stayed around 90% of one core while idle.
    The account was connected and history synchronization had finished.

    To avoid changing my real profile I made a separate copy for testing.
    The official release still showed the problem on that copied profile,
    both with the window focused and after switching away. I also tried a
    patched build on the same copied profile, which used about 0-5% instead.

    I do not know which change explains the difference, and I have not checked
    other operating systems. My earlier report that the problem disappeared
    after startup was based on that single successful launch. The later two
    restarts did not reproduce that improvement.
  expected:
    action: reply
    contains:
    - 90%
    - patched
    max_calls: 8
    min_calls: 1
  decision:
    labels:
    - bug
    reply:
    comment: On Arch Linux v0.14.0, connected sessions stay near 90% CPU after startup
      and two restarts. A patched build uses 0-5% on the same copied profile; the
      official release still reproduces the problem.
