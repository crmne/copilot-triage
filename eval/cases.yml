- id: ruby_llm-1000-closer-look-risk
  title: Reject invalid OpenRouter batch embedding positions
  body: "## What this does\r\n\r\nA successful OpenRouter embedding batch result holds
    one row per input, and each row's `index` says which input the vector belongs
    to. The parser sorted rows by `index` without checking it. Duplicate, gapped,
    and negative positions could therefore produce successful results without a valid
    input-to-vector mapping. Null positions raised `ArgumentError`, and absent keys
    raised `KeyError`, aborting collection for the whole batch. These cases were reproduced
    with mocked responses, not observed in live OpenRouter responses.\r\n\r\nThe parser
    now requires integer positions covering exactly `0...N`, where `N` is the returned
    row count. Invalid positions produce a `nil` result and `:failed` status for that
    request, matching the per-request failure behavior of Gemini, Bedrock, and Vertex
    AI embedding batches. Other requests remain collectible, and valid out-of-order
    rows are still sorted into input order.\r\n\r\nScope stays narrow: chat and Responses
    results, outer `custom_id` validation (#993), `Batch`, synchronous embeddings,
    and request payloads are unchanged.\r\n\r\nFixes #999 \r\n\r\n## Type of change\r\n\r\n-
    [x] Bug fix\r\n- [ ] New feature\r\n- [ ] Breaking change\r\n- [ ] Documentation\r\n-
    [ ] Performance improvement\r\n\r\n## Scope check\r\n\r\n- [x] I read the [Contributing
    Guide](https://github.com/crmne/ruby_llm/blob/main/CONTRIBUTING.md)\r\n- [x] This
    aligns with RubyLLM's focus on **LLM communication**\r\n- [x] This isn't application-specific
    logic that belongs in user code\r\n- [x] This benefits most users, not just my
    specific use case\r\n\r\n## Quality check\r\n\r\n- [x] I ran `overcommit --install`
    and all hooks pass\r\n- [x] I tested my changes thoroughly\r\n  - [ ] For provider
    changes: Re-recorded VCR cassettes with `bundle exec rake vcr:record[provider_name]`\r\n
    \ - [ ] All tests pass: `bundle exec rspec`\r\n- [x] I updated documentation if
    needed\r\n- [x] I didn't modify auto-generated files manually (`models.json`,
    `aliases.json`)\r\n\r\nEight independent regressions cover duplicate, gapped,
    negative, null, string, floating-point, nonzero scalar, and absent positions.
    Each fails against the baseline parser. Each also verifies that a neighboring
    valid request remains collectible; the parameterized cases check vector order,
    token usage, and cost. Existing tests cover scalar, single-element array, and
    reordered multi-vector results.\r\n\r\nLocal validation: 27 focused OpenRouter
    examples and all 3,674 non-live examples pass, including generators. All hooks
    pass with `SPEC_OPTS='--tag ~live' TEST_QUEUE_WORKERS=2 bundle exec overcommit
    --run`; the hook itself excludes generators. The unrestricted `bundle exec rspec`
    checkbox remains unchecked: the original investigation recorded a Vertex AI ranking
    failure without local Google Application Default Credentials, also reproduced
    on the baseline. No live-provider or remote CI success is claimed.\r\n\r\nNo request
    payloads change, so no cassettes were re-recorded.\r\n\r\n## AI-generated code\r\n\r\n-
    [x] I used AI tools to help write this code\r\n- ["
