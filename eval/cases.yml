- id: spotifast-525-closer-look-concrete
  title: 'fix(ui): stop shuffle button from starting playback'
  body: "## Why\n\nThe Shuffle button next to **Play** used to start playback immediately
    when clicked.\n\nThat made it impossible to enable shuffle first and decide separately
    when to start playing the playlist. Since the button is meant to control shuffle
    mode, it should only toggle that state and leave playback to the **Play** button.\n\n##
    What changed\n\n- Updated the Shuffle button next to **Play** so it only toggles
    shuffle mode and no longer starts playback.\n- Kept the active shuffle state visible
    with the accent colour.\n- Left the explicit **Shuffle play** action in context
    menus unchanged.\n- Added a regression test to make sure toggling shuffle does
    not emit a playback action.\n- Updated the README and user guide to reflect the
    new behaviour.\n- Added app-level tests for selecting Shuffle before a device
    is active and pressing **Play** later, and for toggling Shuffle while another
    collection is playing.\n- Updated the queue reference for the global Shuffle mode
    and its effect on playback order.\n- Kept Shuffle pending without a remote request
    when no device is active, with regression coverage for that case and active playback
    whose device ID is unknown.\n\nThere is no linked issue.\n\n## Verification\n\nTested
    on macOS with:\n\n```sh\ncargo fmt --all --check\ncargo clippy --locked --all-targets
    -- -D warnings\ncargo clippy --locked --all-targets --all-features -- -D warnings\ncargo
    test --locked --lib ui::collection::tests::collection_shuffle_button_changes_mode_without_starting_playback
    -- --exact\ncargo test --locked --lib shuffle_selected_without_a_device_applies_when_collection_play_starts\ncargo
    test --locked --lib shuffle_toggle_on_another_collection_keeps_playing_context_until_play\ncargo
    test --locked --all-targets\ncargo test --locked --all-targets --all-features\ncargo
    test --locked --all-features --doc\nRUSTDOCFLAGS='-D warnings' cargo doc --locked
    --all-features --no-deps\n```\n\nFormatting, the focused and full tests, doctests,
    and Rust documentation pass. The new tests use the real collection controls and
    verify that the selected mode survives until **Play**, while toggling Shuffle
    during playback does not start the viewed collection. The follow-up verifies that
    no remote Shuffle request or error is produced without a device, while active
    playback with an unknown device ID still receives the request.\n\nBoth local Clippy
    commands stop at the existing `manual_c_str_literals` lint in `src/mac_touchbar_crash_guard.rs:48`
    on Rust 1.98. That file is unchanged in this PR.\n\nI was not able to run the
    local documentation site build because Bundler 4.0.16 is not installed in this
    environment. The packaging launcher tests fail with this macOS machine's `install`
    and Ruby/Psych versions. GitHub Actions provides the platform and site checks;
    their current results are shown in the PR checks.\n\n### Visual comparison\n\nThe
    visible change is the result of clicking the collection Shuffle button. In the
    baseline, clicking it requests playback of the viewed **Discover Weekly** playlist. "
