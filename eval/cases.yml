- id: ruby_llm-949-closer-look-concrete
  title: Drop foreign provider raw_content on replay
  body: "## What this does\r\n\r\nFixes #948 \r\n\r\nA provider-tool turn keeps the
    producing provider's native content blocks in\r\n`Message#raw_content` so that
    provider can replay the turn exactly (Anthropic\r\n`server_tool_use` / `web_search_tool_result`,
    the Responses protocol's\r\n`web_search_call` / reasoning / `message` items, Gemini's
    server-tool parts).\r\n`format_message` (Anthropic), `format_assistant_items`
    / `format_tool_items`\r\n(Responses), and `format_parts` (Gemini) all replayed
    those blocks whenever\r\n`raw_content` was present, with **no check for which
    provider or protocol\r\nproduced them**. Once a chat moved to another provider
    with `with_model` (or\r\na configured fallback), the previous provider's wire-format
    blocks were\r\ninserted into the new provider's request verbatim.\r\n\r\nThis
    mirrors the `thinking` cross-provider replay bug fixed in #935. That fix\r\nidentified
    the producer from the message's successful `ruby_llm_usage_entries`\r\nand stripped
    foreign `thinking` before rendering. This PR adds the same guard\r\nfor `raw_content`
    — and goes one step further than a pure provider check,\r\nbecause provider identity
    alone is not always enough.\r\n\r\n### Why provider identity alone isn't enough\r\n\r\nVertex
    AI serves Claude, Gemini, and Chat-Completions-compatible models\r\nthrough **one
    provider slug** (`vertexai`) but **three different wire\r\nprotocols** (`VertexAI::Anthropic`,
    `VertexAI::Gemini`,\r\n`VertexAI::ChatCompletions`), selected per model. A message
    produced on a\r\nClaude-on-Vertex turn and a message produced on a Gemini-on-Vertex
    turn both\r\nreport `provider: \"vertexai\"` in their usage entry — so a producer-only
    check\r\n(matching the merged `thinking` fix's granularity) would treat a\r\nClaude-shaped
    `raw_content` moving to a Gemini-on-Vertex turn as \"same\r\nproducer\" and still
    replay Anthropic content blocks into Gemini's `parts`.\r\nThis is caught with
    real, tested reproduction in this PR's regression suite.\r\n\r\n### The fix\r\n\r\n`Message`
    gains `raw_content_protocol` — the registered name of the protocol\r\nthat produced
    `raw_content` (`\"anthropic\"`, `\"responses\"`, `\"gemini\"`, etc.).\r\n`Provider#complete`,
    `#tool_approval_response`, `#compact`, and\r\n`Batch#deliver_message` tag it with
    the resolved protocol's name (reusing the\r\nexisting `batch_protocol_name` reverse
    lookup already used to name protocols\r\nfor batch storage — no new naming scheme).\r\n\r\n`Protocol#preprocess_message`
    drops `raw_content` (and, as before, `thinking`)\r\nwhen the message is foreign
    by **either** signal:\r\n\r\n```ruby\r\ndef foreign_protocol_state?(message)\r\n
    \ producer = producer_slug(message)\r\n  return true if producer && producer !=
    @provider.slug\r\n\r\n  source_protocol = message.raw_content_protocol\r\n  target_protocol
    = @provider.batch_protocol_name(self.class)\r\n  source_protocol && target_protocol
    && source_protocol != target_protocol\r\nend\r\n```\r\n\r\nAn unknown producer
    *and* an untagged protocol (a message from before this\r\nchange, or one built
    by hand without `raw_content_protocol:`) both replay\r\nunchange"
