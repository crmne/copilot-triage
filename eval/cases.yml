- id: ruby_llm-974-closer-look-risk
  title: Let an MCP server use a custom transport
  body: |
    Some MCP servers are reached neither over Streamable HTTP nor over stdio. A server on a user's computer behind a firewall, for example, can only dial out to the app, so the app has to send JSON-RPC messages back through that tunnel. Until now that meant subclassing `RubyLLM::MCP`'s private transports.

    A `transport` setting now takes the object that carries the messages, as a value, a method name, or a block evaluated on the instance:

    ```ruby
    class LaptopFiles < RubyLLM::MCP
      inputs :device
      transport { Tunnel.new(device) }
    end

    RubyLLM.mcp(transport: tunnel, name: "laptop")
    ```

    A transport responds to the same four methods the built-in HTTP and stdio transports already implement: `request(message, version:, timeout:, headers:)`, which returns the response and yields notifications such as progress, then `notify`, `cancel`, and `close`. Everything else stays the same: tools, resources, prompts, progress, input requests, and approvals all go through `Client` as before.

    Details:

    - The transport handles its own authentication and timeouts, so `bearer_token`, `headers`, `oauth`, and `timeout` don't apply to it.
    - `RubyLLM.mcp(transport:)` requires `name:`, since there is no URL or command to derive one from.
    - Subclasses share their parent's transport object instead of getting a `dup` of it, as they do for the other settings.

    The MCP guide gets a Custom Transports section, and `RubyLLM.mcp` and `MCP.transport` have RDoc. Unit specs cover talking through a transport, building it from inputs, inheritance, closing, and the inline name check.

    `bundle exec rspec --tag ~generator`: 4663 examples, 0 failures. RuboCop, ArchSpec, and Flay pass.
  pull_request:
    association: CONTRIBUTOR
    files:
    - path: docs/_core_features/mcp.md
      additions: 31
      deletions: 1
      changeType: MODIFIED
    - path: lib/ruby_llm.rb
      additions: 6
      deletions: 5
      changeType: MODIFIED
    - path: lib/ruby_llm/mcp.rb
