- id: spotifast-531-closer-look-risk
  title: Make top result artists clickable
  body: |
    ## Why

    A song's Top result shows its credited artists, but unlike ordinary song rows,
    those names cannot open the artist page. This makes search navigation
    inconsistent and forces listeners to use the context menu instead.

    ## What changed

    - Render each credited artist in a song Top result as the existing artist-link
      control.
    - Keep the card's album navigation when the artist link did not handle the
      click, and keep artists without a Spotify ID as plain text.
    - Add a demo-mode regression test for the artist navigation action.
    - Document the behavior and add matched native Linux visual-review captures.

    ### Visual review

    [Open the HTML comparison and its capture notes](https://github.com/reedpen/spotifast/tree/top-result-artist-navigation/docs/assets/top-result-artist-navigation).

    The resting layout is intentionally unchanged. The artist name now underlines
    on hover and opens the artist page when selected. The comparison includes
    Before/After controls for light and dark themes at 900x700 and 620x700. The
    interaction test covers the click because the deterministic screenshot runner
    does not position a pointer.

    | Before | After |
    | --- | --- |
    | ![Song Top result before](https://raw.githubusercontent.com/reedpen/spotifast/top-result-artist-navigation/docs/assets/top-result-artist-navigation/before-dark-normal.png) | ![Song Top result after](https://raw.githubusercontent.com/reedpen/spotifast/top-result-artist-navigation/docs/assets/top-result-artist-navigation/after-dark-normal.png) |

    ## Verification

