- id: hyprmoncfg-61-closer-look-concrete
  title: Keep display discovery responsive and reuse layouts on new hardware
  body: |
    This adds reusable layout drafts and keeps display discovery and editor responses correlated with the current hardware while docks connect or disconnect.

    - Add `reuse_profile` and a typed client helper: map saved roles to current screens and return an unnamed draft without applying or saving it. Preserve the original profile and omit its command hook.
    - Preserve target-device calibration, remap mirrors/workspaces, preserve the template's effective generated workspace order before appending extra connected screens, and warn about mode/scale adjustments. Broken mirror dependencies become nonoverlapping independent displays; mode/scale-adapted rectangles are repaired and the final draft is validated. Preserve the selected template's explicit unknown-display policy independently of calibration donors.
    - Bound daemon discovery and apply-engine reads per query, return retryable `compositor_busy` errors, and retain working client connections during recovery. Keep rollback's independent recovery context.
    - Add hardware snapshot hashes to status/editor/reuse responses and verify bindings around workspace reads. Coalesce topology probes, reject stale results and debounce timers (including pre-lid-wake snapshots), and wait for the latest probe before reconciliation. Retry transient failures without another hotplug event.
    - Preserve current upstream's automatic extension, explicit strict-display policy, recovery/backoff, power refresh, and workspace persistence.

    The [companion panel PR](https://github.com/crmne/omarchy-hyprmoncfg/pull/18) provides the reuse form and protects drafts during refresh/recovery.

    Validation: full Go tests, vet, both command builds, and race tests for apply, daemon, profile, appstatus, IPC, Hyprland client, and TUI pass. `go mod tidy` leaves module files unchanged. Regressions cover blocked apply reads with restoration/retry, calibration and ambiguous identity, hardware changes during snapshots, repaired/adapted geometry and mirror alignment, template policy preservation, newer hotplug/lid/timeout ordering, pre-wake poll/hotplug snapshots, explicit/implicit/rule-derived workspace order with skipped and extra displays, and typed IPC errors.

    The 750 ms default is per daemon query, not a whole-operation guarantee. Automatic reconciliation/apply/rollback remains serialized. Display writes and post-apply commands retain their own lifecycle; the terminal editor retains its separate asynchronous refresh context. No physical unfamiliar-dock replug was performed.

    — Astra Ulta
