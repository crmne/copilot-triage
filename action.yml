name: Copilot Triage
description: A maintainer companion with a system prompt and scoped read-only tools.
author: Carmine Paolino
branding:
  icon: message-circle
  color: blue

inputs:
  copilot-token:
    description: Token with Copilot Requests permission and an available Copilot allowance, for the copilot engine.
    default: ''
  github-token:
    description: Token for reading reports, publishing labels and comments, and optionally closing duplicates.
    default: ${{ github.token }}
  config:
    description: Repository-relative policy file on the default branch.
    default: .github/triage.yml
  kind:
    description: issue, discussion, or pull_request; inferred from the triggering event when omitted.
    default: ${{ github.event.discussion && 'discussion' || (github.event.pull_request || github.event.issue.pull_request) && 'pull_request' || 'issue' }}
  number:
    description: Issue, discussion, or pull request number; inferred from the event when omitted.
    default: ${{ github.event.issue.number || github.event.discussion.number || github.event.pull_request.number }}
  model:
    description: Model ID; for the rubyllm engine, as the provider names it.
    default: gpt-5.6-luna
  engine:
    description: copilot runs Copilot CLI with your Copilot allowance; rubyllm uses a provider API key through RubyLLM.
    default: copilot
  provider:
    description: RubyLLM provider for the rubyllm engine, such as openai, anthropic, gemini, openrouter, or ollama.
    default: ''
  api-key:
    description: API key for the rubyllm engine's provider.
    default: ''
  api-base:
    description: Custom endpoint for the rubyllm engine, such as an OpenAI-compatible server.
    default: ''
  review-token:
    description: Token that requests Copilot code reviews of pull requests, billed to its owner; defaults to copilot-token.
    default: ''
  reasoning-effort:
    description: Copilot reasoning effort (none or low), or default for models without the setting.
    default: low
  dry-run:
    description: Preview the decision without publishing. Model calls still consume credits.
    default: 'false'
  debounce-seconds:
    description: Wait for nearby follow-up comments before assessment (0 to 60 seconds).
    default: '10'
  mode:
    description: triage assesses the triggering report; sweep updates the project board without a model.
    default: triage
  project-token:
    description: Classic token with the project scope (and repo for private repositories), used only for the board.
    default: ''

runs:
  using: composite
  steps:
    - name: Check the mode and engine
      if: (inputs.mode != 'triage' && inputs.mode != 'sweep') || (inputs.engine != 'copilot' && inputs.engine != 'rubyllm')
      shell: bash
      run: |
        echo "mode must be triage or sweep, and engine copilot or rubyllm" >&2
        exit 1
    - name: Check event eligibility
      id: event
      if: inputs.mode == 'triage'
      shell: bash
      run: ruby "$TRIAGE_ACTION_PATH/lib/triage_event.rb"
      env:
        TRIAGE_ACTION_PATH: ${{ github.action_path }}
    - uses: actions/checkout@v7
      if: steps.event.outputs.eligible == 'true' || inputs.mode == 'sweep'
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false
        token: ${{ inputs.github-token }}
    - uses: actions/cache@v6
      if: steps.event.outputs.eligible == 'true'
      with:
        path: ${{ runner.temp }}/copilot-triage-state
        key: triage-v2-${{ inputs.kind }}-${{ inputs.number }}-${{ steps.event.outputs.thread }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: triage-v2-${{ inputs.kind }}-${{ inputs.number }}-${{ steps.event.outputs.thread }}-
    - name: Prepare an eligible report
      id: report
      if: steps.event.outputs.eligible == 'true'
      shell: bash
      run: ruby "$TRIAGE_ACTION_PATH/lib/assessment.rb"
      env:
        TRIAGE_ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        TRIAGE_CONFIG: ${{ inputs.config }}
        TRIAGE_KIND: ${{ inputs.kind }}
        TRIAGE_NUMBER: ${{ inputs.number }}
        TRIAGE_DRY_RUN: ${{ inputs.dry-run }}
        TRIAGE_STATE_DIR: ${{ runner.temp }}/copilot-triage-state
        TRIAGE_PREPARE_ONLY: 'true'
        TRIAGE_PREPARED_PATH: ${{ runner.temp }}/copilot-triage-prepared.json
        TRIAGE_DEBOUNCE_SECONDS: ${{ inputs.debounce-seconds }}
        TRIAGE_METRICS_PATH: ${{ runner.temp }}/copilot-triage-metrics.json
    - name: Restore Copilot CLI
      id: cli
      if: steps.report.outputs.eligible == 'true' && inputs.engine == 'copilot'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/copilot-triage-cli
        key: copilot-cli-${{ runner.os }}-${{ runner.arch }}-1.0.83
    - name: Install Copilot
      if: steps.report.outputs.eligible == 'true' && inputs.engine == 'copilot' && steps.cli.outputs.cache-hit != 'true'
      shell: bash
      run: npm install --prefix "$RUNNER_TEMP/copilot-triage-cli" --no-audit --no-fund @github/copilot@1.0.83
    - name: Check Ruby
      id: ruby
      if: steps.report.outputs.eligible == 'true' && inputs.engine == 'rubyllm'
      shell: bash
      run: echo "version=$(ruby -e 'print RUBY_VERSION')" >> "$GITHUB_OUTPUT"
    - name: Restore RubyLLM
      id: gems
      if: steps.report.outputs.eligible == 'true' && inputs.engine == 'rubyllm'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/copilot-triage-gems
        key: rubyllm-${{ runner.os }}-${{ runner.arch }}-ruby-${{ steps.ruby.outputs.version }}-2.0.0
    - name: Install RubyLLM
      if: steps.report.outputs.eligible == 'true' && inputs.engine == 'rubyllm' && steps.gems.outputs.cache-hit != 'true'
      shell: bash
      run: gem install ruby_llm --version 2.0.0 --install-dir "$RUNNER_TEMP/copilot-triage-gems" --no-document
    - name: Assess the report
      if: steps.report.outputs.eligible == 'true'
      shell: bash
      run: |
        export PATH="$RUNNER_TEMP/copilot-triage-cli/node_modules/.bin:$PATH"
        export GEM_PATH="$RUNNER_TEMP/copilot-triage-gems:$(ruby -e 'print Gem.default_path.join(":")')"
        ruby "$TRIAGE_ACTION_PATH/lib/assessment.rb"
      env:
        TRIAGE_ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot-token }}
        TRIAGE_CONFIG: ${{ inputs.config }}
        TRIAGE_KIND: ${{ inputs.kind }}
        TRIAGE_NUMBER: ${{ inputs.number }}
        TRIAGE_MODEL: ${{ inputs.model }}
        TRIAGE_REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        TRIAGE_ENGINE: ${{ inputs.engine }}
        TRIAGE_PROVIDER: ${{ inputs.provider }}
        TRIAGE_API_KEY: ${{ inputs.api-key }}
        TRIAGE_API_BASE: ${{ inputs.api-base }}
        TRIAGE_DRY_RUN: ${{ inputs.dry-run }}
        TRIAGE_STATE_DIR: ${{ runner.temp }}/copilot-triage-state
        TRIAGE_PREPARED_PATH: ${{ runner.temp }}/copilot-triage-prepared.json
        TRIAGE_METRICS_PATH: ${{ runner.temp }}/copilot-triage-metrics.json
        TRIAGE_PROJECT_TOKEN: ${{ inputs.project-token }}
        TRIAGE_REVIEW_TOKEN: ${{ inputs.review-token }}
    - name: Sweep the project board
      if: inputs.mode == 'sweep'
      shell: bash
      run: ruby "$TRIAGE_ACTION_PATH/lib/board_sweep.rb"
      env:
        TRIAGE_ACTION_PATH: ${{ github.action_path }}
        TRIAGE_CONFIG: ${{ inputs.config }}
        TRIAGE_DRY_RUN: ${{ inputs.dry-run }}
        TRIAGE_PROJECT_TOKEN: ${{ inputs.project-token }}
