name: Released fixes

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose fixed issues to settle
        required: true
      dry_run:
        description: Preview without changing the issues
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: read

# Copilot Triage's own workflow does the rest, and updates with its v0 tag.
jobs:
  settle:
    uses: crmne/copilot-triage/.github/workflows/settle.yml@v0
    secrets: inherit
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      dry_run: ${{ inputs.dry_run || false }}
