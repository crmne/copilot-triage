# The board's daily sweep, called by each repository's own workflow:
#
#   jobs:
#     sweep:
#       uses: crmne/copilot-triage/.github/workflows/sweep.yml@v0
#       secrets: inherit
name: Sweep

on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
      triage_workflow:
        description: The repository's triage workflow, which the sweep sends fork pull requests to
        type: string
        default: triage.yml

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  sweep:
    if: vars.COPILOT_ISSUE_ASSESSMENT_ENABLED == 'true'
    concurrency:
      group: board
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: crmne/copilot-triage@v0
        with:
          mode: sweep
          project-token: ${{ secrets.TRIAGE_PROJECT_TOKEN }}
          triage-workflow: ${{ inputs.triage_workflow }}
          dry-run: ${{ inputs.dry_run }}
